<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile README Preview</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --fg: #1f2328;
      --bg: #ffffff;
      --muted: #656d76;
      --border: #d0d7de;
      --link: #0969da;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
      margin: 0;
      padding: 0;
    }
    .markdown-body {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
    }
    .markdown-body h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
    .markdown-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1em; }
    .markdown-body p { margin-top: 0; margin-bottom: 16px; }
    .markdown-body a { color: var(--link); text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body img { max-width: 100%; }
    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 85%;
      padding: .2em .4em;
      background: rgba(175,184,193,.2);
      border-radius: 6px;
    }
    .markdown-body pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow: auto; }
    .markdown-body pre code { background: none; padding: 0; }
    .markdown-body blockquote {
      padding: 0 1em;
      color: var(--muted);
      border-left: .25em solid var(--border);
      margin: 0 0 16px 0;
    }
    .markdown-body table {
      border-spacing: 0;
      border-collapse: collapse;
      display: block;
      width: 100%;
      overflow: auto;
    }
    .markdown-body table th, .markdown-body table td {
      padding: 6px 13px;
      border: 1px solid var(--border);
    }
    .markdown-body table tr:nth-child(2n) { background: #f6f8fa; }
    .markdown-body hr {
      height: .25em;
      padding: 0;
      margin: 24px 0;
      background-color: var(--border);
      border: 0;
    }
    .markdown-body ul, .markdown-body ol { padding-left: 2em; }
    .markdown-body li + li { margin-top: .25em; }
    .loading { text-align: center; padding: 64px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="markdown-body">
    <div class="loading" id="loading">Loading README…</div>
    <div id="content"></div>
  </div>
  <script>
    marked.setOptions({ gfm: true, breaks: false });
    fetch('README.md')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (text) {
        document.getElementById('content').innerHTML = marked.parse(text);
        document.getElementById('loading').style.display = 'none';
      })
      .catch(function (err) {
        document.getElementById('loading').textContent = 'Failed to load README.md: ' + err.message;
      });
  </script>
</body>
</html>
